spring.application.name=Food ordering
server.port=8081


# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/foodordering?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
#spring.datasource.password=Akhil@0707
spring.datasource.password=${DB_PASSWORD:Akhil@0707}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialect (important)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false



app.jwt.secret=${JWT_SECRET:change-this-super-secret-key-which-is-at-least-32-bytes-long!!}
# Token validity in milliseconds (default 24h)
app.jwt.expiration-ms=86400000
